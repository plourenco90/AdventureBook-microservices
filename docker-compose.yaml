services:
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: adventure_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adventure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adventure_dev}
      POSTGRES_DB: adventurebook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: adventure-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8081
#      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME: http://keycloak:8081
      KC_HOSTNAME_STRICT: false
    ports:
      - "8081:8081"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8081'" ]
      interval: 10s
      timeout: 5s
      retries: 20

  book-service:
    build:
      context: .
      dockerfile: book-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      BOOK_DB_URL: jdbc:postgresql://postgres:5432/adventurebook
      KEYCLOAK_ISSUER_URI: http://keycloak:8081/realms/adventure
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  adventure-service:
    build:
      context: .
      dockerfile: adventure-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      ADVENTURE_DB_URL: jdbc:postgresql://postgres:5432/adventurebook
      BOOK_SERVICE_URL: http://book-service:8082
      KEYCLOAK_ISSUER_URI: http://keycloak:8081/realms/adventure
      ADVENTURE_SERVICE_CLIENT_SECRET: adventure-service-secret
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      book-service:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      BOOK_SERVICE_URL: http://book-service:8082
      ADVENTURE_SERVICE_URL: http://adventure-service:8083
    ports:
      - "8080:8080"
    depends_on:
      - book-service
      - adventure-service

  frontend:
    build:
      context: ./adventure-book-front-angular
    ports:
      - "4200:80"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  keycloak_data:
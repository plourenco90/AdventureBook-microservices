server:
  port: 8082
  servlet:
    context-path: /api

spring:
  application:
    name: book-service

  datasource:
    url: ${BOOK_DB_URL:jdbc:postgresql://localhost:5432/adventurebook}
    username: ${BOOK_DB_USERNAME:adventure}
    password: ${BOOK_DB_PASSWORD:adventure_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: book_service

  flyway:
    enabled: true
    schemas: book_service
    create-schemas: true
    locations: classpath:db/migration
    clean-disabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/adventure}

logging:
  level:
    root: INFO
    com.pictet.bookservice: DEBUG
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    keycloak:
      token-url: ${KEYCLOAK_TOKEN_URL:http://localhost:8081/realms/adventure/protocol/openid-connect/token}
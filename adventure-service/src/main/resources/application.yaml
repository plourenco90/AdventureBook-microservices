
server:
  port: 8083
  servlet:
    context-path: /api

spring:
  application:
    name: adventure-service

  datasource:
    url: ${ADVENTURE_DB_URL:jdbc:postgresql://localhost:5432/adventurebook}
    username: ${ADVENTURE_DB_USERNAME:adventure}
    password: ${ADVENTURE_DB_PASSWORD:adventure_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: adventure_service

  flyway:
    enabled: true
    schemas: adventure_service
    create-schemas: true
    locations: classpath:db/migration
    clean-disabled: true

  security:
    oauth2:
      client:
        registration:
          book-service:
            provider: keycloak
            client-id: adventure-service
            client-secret: ${ADVENTURE_SERVICE_CLIENT_SECRET:adventure-service-secret}
            authorization-grant-type: client_credentials
            scope:
              - books.internal.read
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/adventure}

clients:
  book-service:
    url: ${BOOK_SERVICE_URL:http://localhost:8082}

logging:
  level:
    root: INFO
    com.pictet.adventureservice: DEBUG
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN


resilience4j:
  circuitbreaker:
    instances:
      bookService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

  retry:
    instances:
      bookService:
        maxAttempts: 2
        waitDuration: 300ms
        retryExceptions:
          - com.pictet.adventureservice.infrastructure.client.book.exception.BookServiceUnavailableException
        ignoreExceptions:
          - com.pictet.adventureservice.infrastructure.client.book.exception.BookNotFoundException

  bulkhead:
    instances:
      bookService:
        maxConcurrentCalls: 10
        maxWaitDuration: 0ms

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    circuitbreakers:
      enabled: true
